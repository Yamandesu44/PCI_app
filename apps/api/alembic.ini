[alembic]
script_location = alembic
prepend_sys_path = .
path_separator = os
# Keep this file ASCII-only: alembic reads it with the locale encoding,
# which is cp932 on Japanese Windows, and non-ASCII bytes abort the command.
#
# The target is resolved by alembic/env.py via Settings (env var, then .env).
# Leaving a value here would let a lost setting silently migrate that database.
sqlalchemy.url =

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
