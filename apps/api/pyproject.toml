[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pci-api"
version = "0.1.0"
description = "競馬展開予想 SaaS — FastAPI バックエンド"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.30.0",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "psycopg[binary]>=3.1",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-cov>=5.0",
    "hypothesis>=6.103",
    "mypy>=1.10",
    "ruff>=0.4",
    "import-linter>=2.1",
    "testcontainers[postgres]>=4.7",
    "httpx>=0.27",
]

[tool.hatch.build.targets.wheel]
packages = ["src/pci"]

# ----- mypy -----
[tool.mypy]
strict = true
python_version = "3.11"
mypy_path = "src"

# ----- ruff -----
[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM"]

# ----- pytest -----
[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
    "integration: testcontainers を使う統合テスト（--runintegration フラグで実行）",
]

# ----- coverage -----
[tool.coverage.run]
source = ["src"]
branch = true

[tool.coverage.report]
exclude_lines = ["if TYPE_CHECKING:", "raise NotImplementedError"]

# ----- import-linter -----
[tool.importlinter]
root_package = "pci"
include_external_packages = true

[[tool.importlinter.contracts]]
name = "レイヤードアーキテクチャの依存方向"
type = "layers"
layers = [
    "pci.presentation",
    "pci.infrastructure",
    "pci.application",
    "pci.domain",
]

[[tool.importlinter.contracts]]
name = "domain に外部フレームワーク依存なし"
type = "forbidden"
source_modules = ["pci.domain"]
forbidden_modules = [
    "sqlalchemy",
    "pydantic",
    "fastapi",
]
