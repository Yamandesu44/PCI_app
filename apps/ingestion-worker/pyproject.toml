[build-system]
requires = ["setuptools>=70"]
build-backend = "setuptools.build_meta"

[project]
name = "pci-ingestion-worker"
version = "0.1.0"
description = "JV-Link データ取り込みワーカー（Windows 専用・日次バッチ）"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
# Windows 環境でのみインストールする（JV-Link COM 呼び出し）
win = [
    "pywin32>=306",
]
mysql = [
    "PyMySQL>=1.1",
]
dev = [
    "pytest>=8",
    "ruff>=0.4",
    "mypy>=1.10",
]

[project.scripts]
pci-ingest = "ingestion.batch:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
