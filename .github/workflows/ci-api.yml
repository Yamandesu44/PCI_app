name: API CI

on:
  push:
    paths:
      - "apps/api/**"
      - ".github/workflows/ci-api.yml"
  pull_request:
    paths:
      - "apps/api/**"
      - ".github/workflows/ci-api.yml"

jobs:
  quality:
    name: Type / Lint / Import
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          # 型チェックは pyproject の [tool.mypy] python_version と揃える。
          # 3.12 で走らせると numpy 2.5 系（3.12以上専用）が入り、その型スタブが
          # PEP695 の `type` 文を使うため、3.11 を対象とした解析が構文エラーで落ちる。
          #   numpy/__init__.pyi: error: Type statement is only supported in Python 3.12+
          # requires-python = ">=3.11" を掲げている以上、下限で検証するのが筋。
          python-version: "3.11"
          cache: pip

      - name: Install dev dependencies
        run: pip install -e ".[dev]"

      - name: mypy --strict
        run: mypy src/ --strict

      - name: ruff lint
        run: ruff check src/ tests/

      - name: ruff format check
        run: ruff format --check src/ tests/

      - name: import-linter
        run: lint-imports

  test:
    name: Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"  # CI は最新を使用
          cache: pip

      - name: Install dev dependencies
        run: pip install -e ".[dev]"

      - name: pytest (unit + contract — fast / no DB)
        run: >
          pytest tests/unit/ tests/contract/
          -v
          --cov=src/pci/domain
          --cov=src/pci/application
          --cov=src/pci/presentation
          --cov-report=term-missing
          --cov-fail-under=90

  test-integration:
    name: Integration Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dev dependencies
        run: pip install -e ".[dev]"

      - name: pytest (integration — testcontainers)
        run: pytest tests/integration/ -v -m integration

  docker:
    name: Docker Image
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # レジストリへは push しない。認証情報を要さずに Dockerfile の妥当性だけを検証する。
      # デプロイ先（Railway / Render / Fly.io など）が決まったら push 段を足す。
      - name: Build API image
        run: docker build -t pci-api:ci apps/api

      # デプロイ先の枠（512MB など）に収まるかを数字で判断できるようにする。
      # LightGBM を読み込んだ状態が実運用のピークに近い。
      - name: Report image size and model-loaded memory
        run: |
          size_mb=$(( $(docker image inspect pci-api:ci --format '{{.Size}}') / 1024 / 1024 ))
          echo "image_size_mb=${size_mb}"
          docker run --rm pci-api:ci python -c "import resource; from pci.infrastructure.pace.lgbm_forecaster import load_best_forecaster as L; f=L(); print('forecaster=' + type(f).__name__); print('peak_rss_mb=%.0f' % (resource.getrusage(resource.RUSAGE_SELF).ru_maxrss / 1024))"

      # モデルが読めていないと精度だけ静かに失う。イメージ側の配置を回帰テストする。
      - name: Fail if the image falls back to the rule-based forecaster
        run: |
          picked=$(docker run --rm pci-api:ci python -c "from pci.infrastructure.pace.lgbm_forecaster import load_best_forecaster as L; print(type(L()).__name__)")
          echo "forecaster=${picked}"
          if [ "${picked}" = "RuleBasedRpciForecaster" ]; then
            echo "LightGBM モデルを読めていない（MODELS_DIR / models/ の配置を確認）" >&2
            exit 1
          fi

      # 起動できることまで見る。DB 無しでも /health は応答する設計。
      - name: Smoke test the container
        run: |
          docker run -d --name pci-api-ci -p 8000:8000 pci-api:ci
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8000/health > /dev/null; then
              echo "health ok"
              # 実際に常駐するプロセスの使用量。前段の peak_rss_mb は素の python で
              # モデルを読んだだけの値で、uvicorn/FastAPI/SQLAlchemy を含まない。
              # デプロイ先の枠を判断するにはこちらとモデル分の両方が要る。
              docker stats --no-stream --format 'container_idle_mem={{.MemUsage}}' pci-api-ci
              docker rm -f pci-api-ci
              exit 0
            fi
            sleep 2
          done
          echo "health check did not pass in time" >&2
          docker logs pci-api-ci >&2
          docker rm -f pci-api-ci
          exit 1
