name: API CI

on:
  push:
    paths:
      - "apps/api/**"
      - ".github/workflows/ci-api.yml"
  pull_request:
    paths:
      - "apps/api/**"
      - ".github/workflows/ci-api.yml"

jobs:
  quality:
    name: Type / Lint / Import
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          # 型チェックは pyproject の [tool.mypy] python_version と揃える。
          # 3.12 で走らせると numpy 2.5 系（3.12以上専用）が入り、その型スタブが
          # PEP695 の `type` 文を使うため、3.11 を対象とした解析が構文エラーで落ちる。
          #   numpy/__init__.pyi: error: Type statement is only supported in Python 3.12+
          # requires-python = ">=3.11" を掲げている以上、下限で検証するのが筋。
          python-version: "3.11"
          cache: pip

      - name: Install dev dependencies
        run: pip install -e ".[dev]"

      - name: mypy --strict
        run: mypy src/ --strict

      - name: ruff lint
        run: ruff check src/ tests/

      - name: ruff format check
        run: ruff format --check src/ tests/

      - name: import-linter
        run: lint-imports

  test:
    name: Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"  # CI は最新を使用
          cache: pip

      - name: Install dev dependencies
        run: pip install -e ".[dev]"

      - name: pytest (unit + contract — fast / no DB)
        run: >
          pytest tests/unit/ tests/contract/
          -v
          --cov=src/pci/domain
          --cov=src/pci/application
          --cov=src/pci/presentation
          --cov-report=term-missing
          --cov-fail-under=90

  test-integration:
    name: Integration Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dev dependencies
        run: pip install -e ".[dev]"

      - name: pytest (integration — testcontainers)
        run: pytest tests/integration/ -v -m integration
