services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: pci
      POSTGRES_PASSWORD: pci_dev
      POSTGRES_DB: pci_dev
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pci -d pci_dev"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
